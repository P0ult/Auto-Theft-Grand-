[/Script/EngineSettings.GameMapsSettings]
; The world is generated at runtime, so the game starts on the engine's empty map with our game mode.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/AutoTheftGrand.ATGGameMode

[/Script/Engine.RendererSettings]
; Lumen for light and reflections, virtual shadow maps. Everything is lit at runtime (the world is built
; when the game starts), so there is no baked lighting.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
; The generated meshes have no distance fields (those are only built for imported assets), so Lumen sees
; them through hardware ray tracing. On a GPU without it Unreal falls back to software Lumen, which then
; lights mostly from the screen and the sky: set these two to False to always use that.
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
; exposure limits (ATGWorld's MinExposureEV100 / MaxExposureEV100) are in EV100
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/AutoTheftGrand")

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

